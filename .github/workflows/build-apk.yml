name: Assemble Production Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: npm ci

      - name: Run APK Release Packager
        run: python3 scripts/android/release-apk.py

      - name: Package Browser Extension
        run: python3 scripts/build-extension.py

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: mindset-machine-release-bundle
          path: |
            public/download/mindset-machine-release.apk
            public/download/mindset-machine-extension.zip
            public/download/release-metadata.json
            public/download/extension-metadata.json

      - name: Attach Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/download/mindset-machine-release.apk
            public/download/mindset-machine-extension.zip
            public/download/release-metadata.json
            public/download/extension-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
